name: Weekly encrypted Supabase Storage backup

on:
  workflow_dispatch:
  schedule:
    - cron: "43 22 * * 6" # Sunday 02:43 Asia/Dubai

permissions:
  contents: read

jobs:
  backup-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download, encrypt, verify, and upload Storage objects
        env:
          SUPABASE_URL: https://jmvqqpughlzeqrcyavwz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_UPLOADER: scripts/upload-backup-sharepoint.mjs
          BACKUP_REMOTE_FOLDER: disaster-recovery/storage
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_DRIVE_ID: ${{ secrets.MICROSOFT_DRIVE_ID }}
          MICROSOFT_ROOT_FOLDER: Kridiya Business
        run: node scripts/backup-supabase-storage.mjs
