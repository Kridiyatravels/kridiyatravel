name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML, links, schema, sitemap, and asset budgets
        run: node scripts/site-check.mjs
      - name: Run application contract smoke tests
        run: node scripts/smoke-contracts.mjs
