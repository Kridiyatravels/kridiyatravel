<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Login — Kridiya Travel and Tourism</title>
<meta name="description" content="Log in to your Kridiya Travel account to view your enquiries and manage your profile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
<header id="site-header" class="site-header"></header>
<main>
  <div class="container auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to see your enquiries and get faster quotes.</p>
      <form id="login-form" class="form-grid" novalidate>
        <div class="form-banner error" hidden role="alert"></div>
        <div class="field">
          <label for="lg-email">EMAIL</label>
          <input id="lg-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="lg-pass">PASSWORD</label>
          <div class="pw-wrap">
            <input id="lg-pass" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
            <button type="button" class="pw-toggle" aria-label="Show password">SHOW</button>
          </div>
        </div>
        <label class="checkbox-row"><input type="checkbox" name="remember" checked> Keep me signed in on this device</label>
        <button class="btn btn-primary btn-block btn-lg" type="submit" data-label="Log in">Log in</button>
      </form>
      <p class="auth-alt">New to Kridiya Travel? <a href="register.html"><b>Create an account</b></a></p>
      <p class="form-note" style="text-align:center">Forgot your password? WhatsApp us on <a href="https://wa.me/971509413873" target="_blank" rel="noopener">+971 50 941 3873</a> and we'll help you reset it.</p>
    </div>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="js/main.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
