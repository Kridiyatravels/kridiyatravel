<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password &mdash; Kridiya Travel and Tourism</title>
<meta name="description" content="Choose a new password for your Kridiya Travel account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="reset-password">
<header id="site-header" class="site-header"></header>
<main>
  <div class="container auth-wrap">
    <div class="auth-card">
      <h1>Reset password</h1>
      <p class="auth-sub">Enter a new password for your Kridiya Travel account.</p>
      <form id="reset-password-form" class="form-grid" novalidate>
        <div class="form-banner error" hidden role="alert"></div>
        <div class="field">
          <label for="rp-pass">NEW PASSWORD</label>
          <div class="pw-wrap">
            <input id="rp-pass" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters, letters + numbers">
            <button type="button" class="pw-toggle" aria-label="Show password">SHOW</button>
          </div>
        </div>
        <div class="field">
          <label for="rp-confirm">CONFIRM PASSWORD</label>
          <input id="rp-confirm" name="confirm" type="password" autocomplete="new-password" required placeholder="Type it again">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" data-label="Save new password">Save new password</button>
      </form>
      <p class="auth-alt"><a href="login.html"><b>Back to login</b></a></p>
    </div>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="js/main.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
